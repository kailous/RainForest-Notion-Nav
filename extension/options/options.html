  <!-- 添加/编辑弹窗 -->
  <div class="saas-modal-overlay" id="modal" style="display: none;">
    <div class="saas-modal">
      <div class="saas-modal-header">
        <div class="saas-modal-title-row">
          <div class="saas-modal-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 2H9C4 2 2 4 2 9V15C2 20 4 22 9 22H15C20 22 22 20 22 15V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.04 3.02001L8.16 10.9C7.86 11.2 7.56 11.79 7.5 12.22L7.07 15.23C6.91 16.32 7.68 17.08 8.77 16.93L11.78 16.5C12.2 16.44 12.79 16.14 13.1 15.84L20.98 7.96001C22.34 6.60001 22.98 5.02001 20.98 3.02001C18.98 1.02001 17.4 1.66001 16.04 3.02001Z" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.91 4.1499C15.58 6.5399 17.45 8.4099 19.85 9.0899" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <h3 id="modalTitle">添加条目</h3>
            <p class="saas-modal-subtitle" id="modalSubtitle">填写导航条目的信息</p>
          </div>
        </div>
        <button class="saas-modal-close" id="modalClose">&times;</button>
      </div>
      <div class="saas-modal-divider"></div>
      <form id="entryForm">
        <div class="saas-modal-body">
          <div class="saas-form-row">
            <div class="saas-field">
              <label>名称 <span class="saas-required">*</span></label>
              <input type="text" id="entryName" required placeholder="站点名称">
            </div>
            <div class="saas-field">
              <label>链接 <span class="saas-required">*</span></label>
              <input type="url" id="entryUrl" required placeholder="https://example.com">
            </div>
          </div>
          <div class="saas-field">
            <label>描述</label>
            <input type="text" id="entryDesc" placeholder="简短描述（可选）">
          </div>
          <div class="saas-field">
            <label>分类</label>
            <div class="saas-tag-input" id="tagInput">
              <div id="tagChips"></div>
              <input type="text" id="tagInputField" placeholder="输入后按回车添加">
            </div>
          </div>
          <div class="saas-field">
            <label>图标 URL</label>
            <input type="url" id="entryIcon" placeholder="https://example.com/icon.png">
            <p style="font-size: var(--font-size-xs); color: var(--text-color); margin-top: 6px; opacity: 0.6;">支持 PNG/JPG/SVG 等图片格式，或使用 Google Favicon</p>
          </div>
        </div>
        <div class="saas-modal-footer">
          <button type="button" class="saas-btn-ghost" id="cancelBtn">取消</button>
          <button type="submit" class="saas-btn-primary" id="saveBtn">添加</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="options.js"></script>
